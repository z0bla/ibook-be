version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: ibook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibook_user
      POSTGRES_PASSWORD: ibook_password
      POSTGRES_DB: ibook_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibook_user -d ibook_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
